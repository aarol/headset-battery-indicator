name: Release
on:
  push:
    tags: ["v*"]

permissions:
  id-token: write
  attestations: write
  contents: write    

jobs:
  release:
    runs-on: windows-2022
    environment: actions
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "build-cache"

      - run: cargo build --release
      - run: cargo build --release --bin headset-battery-indicator-portable --features portable

      - run: ISCC ./installer.iss
            # result in ./Output/HeadsetBatteryIndicatorSetup.exe
      - run: cp target/release/headset-battery-indicator-portable.exe ./Output/HeadsetBatteryIndicatorPortable.exe

      - name: Sign executable
        env:
          CERTIFICATE_PFX_BASE64: ${{ secrets.CERTIFICATE_PFX_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        shell: pwsh
        run: |
          # Decode and save certificate
          [Convert]::FromBase64String($env:CERTIFICATE_PFX_BASE64) | Set-Content -Path certificate_from_secret.pfx -AsByteStream

          # Sign the executable
          $SignTool = Get-ChildItem -Path "C:\\Program Files*\\Windows Kits\\*\\bin\\*\\x64\\signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1
          $SignToolPath = $SignTool.FullName
          & $SignToolPath sign /f certificate_from_secret.pfx /p $env:CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "Output/HeadsetBatteryIndicatorSetup.exe"
          & $SignToolPath sign /f certificate_from_secret.pfx /p $env:CERTIFICATE_PASSWORD /tr http://timestamp.digicert.com /td sha256 /fd sha256 "Output/HeadsetBatteryIndicatorPortable.exe"

          # Clean up certificate
          Remove-Item certificate_from_secret.pfx

      - name: Attest Build Provenance
        uses: actions/attest@v4
        with:
          subject-path: |
            Output/HeadsetBatteryIndicatorSetup.exe
            Output/HeadsetBatteryIndicatorPortable.exe

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/HeadsetBatteryIndicatorSetup.exe
            Output/HeadsetBatteryIndicatorPortable.exe
          body_path: "changelog/${{github.ref_name}}.md"
          draft: true
          name: Release ${{github.ref_name}}
