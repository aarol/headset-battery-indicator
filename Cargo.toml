[package]
name = "headset-battery-indicator"
version = "3.2.0"
edition = "2024"
authors = ["Aaro Luomanen"]
description = "Displays a battery icon in the Windows system tray for wireless headsets."
license = "MIT"
homepage = "https://github.com/aarol/headset-battery-indicator"
default-run = "headset-battery-indicator-debug"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "headset-battery-indicator-debug"
path = "src/bin/debug.rs"

[dependencies]
anyhow = "1.0.99"
dirs = "6.0.0"
hidapi = "2.6.3"
log = "0.4.22"
serde = "1.0.219"
serde_derive = "1.0.228"
serde_json = "1.0.145"
simplelog = { version = "0.12.2", features = ["paris"] }
sys-locale = "0.3.2"
toml = "0.9.5"
tray-icon = "0.21.2"
winit = "0.30.12"
softbuffer = "0.4.6"
tiny-skia = "0.11.4"
ab_glyph = "0.2.29"
svgtypes = "0.15.3"
font-kit = "0.14.2"
pathfinder_geometry = "0.5.1"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
